<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swagbucks</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff7fb;--card:#fff;--line:#f7c9de;--tx:#3a1a2b;--mu:#8f6277;--ac:#e0287d;--g1:#ff6fae;--g2:#d81b78}
html{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800}.logo b{color:var(--ac)}
.lg{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#ff6fae,#d81b78);color:#fff;display:grid;place-items:center;font-style:italic;font-size:24px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-weight:700;color:var(--ac)}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:28px;padding:22px}
.big{font-size:44px;font-weight:800;margin:4px 0 12px}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:#fff;min-width:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:0;border-radius:24px;padding:12px 20px;font-weight:700;font-size:15px;background:linear-gradient(135deg,#ff6fae,#e0287d);color:#fff;cursor:pointer}
.btn.g{background:rgba(255,255,255,.25)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.w{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 6px;text-align:center}.stat b{display:block;font-size:19px}.stat span{color:var(--mu);font-size:13px}
h2{font-size:26px;margin:20px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.done{opacity:.55}.rw{color:var(--ac);font-weight:800}
input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;margin:6px 0 10px}
label{color:var(--mu);font-size:13px}.mu{color:var(--mu);font-size:14px;line-height:1.5}
.link{word-break:break-all;background:#fde7f1;border-radius:12px;padding:10px;font-size:13px;margin:8px 0}
.hist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:20px;font-weight:700;z-index:9}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;background:linear-gradient(135deg,#ee4093,#e02a87);border-radius:30px;display:flex;padding:8px 4px}
nav button{flex:1;border:0;background:none;color:#ffd6e9;font-weight:700;font-size:13px;padding:6px 0 4px;cursor:pointer}
nav button svg{display:block;margin:0 auto 4px;width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button+button{border-left:1px solid rgba(255,255,255,.35)}
nav button::after{content:"";display:block;height:3px;margin:5px auto 0;width:70%}nav button.on{color:#fff}nav button.on::after{background:#fff;border-radius:3px}
</style></head><body><div id="app"></div>
<script>
const BRAND="Swagbucks",SUPABASE_URL="https://dnayhsdlgjabxvwchxap.supabase.co",SUPABASE_KEY="sb_publishable__cbb6UTRST6ZCOidVFYgog_xeS6bOmh";
const MIN=30000,BONUS=500,TG="https://t.me/allverugf";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let U=null,P=null,done={},hist=[],wd=[],refs=0,page="home",mode="login",tgOpened=false,readLeft=null,timer=null,busy=false;
const $=id=>document.getElementById(id),N=n=>"₦"+Number(n||0).toLocaleString(),
 esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ref=(new URLSearchParams(location.search).get("ref")||"").toUpperCase();
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
async function load(){
 const{data:{session}}=await sb.auth.getSession();U=session&&session.user;
 if(!U){P=null;return draw()}
 const[p,t,l,w]=await Promise.all([sb.from("profiles").select("*").single(),sb.from("tasks_done").select("task"),
  sb.from("ledger").select("*").order("created_at",{ascending:false}),sb.from("withdrawals").select("*").order("created_at",{ascending:false})]);
 P=p.data;done={};(t.data||[]).forEach(x=>done[x.task]=1);hist=l.data||[];wd=w.data||[];refs=hist.filter(h=>h.reason==="Referral").length;draw()}
async function auth(){
 const e=$("em").value.trim(),pw=$("pw").value;if(!e||pw.length<6)return toast("Enter email and a 6+ character password");
 busy=true;let r;
 if(mode==="reg"){const n=$("nm").value.trim();if(!n){busy=false;return toast("Enter your name")}
  r=await sb.auth.signUp({email:e,password:pw,options:{data:{name:n,ref}}})}
 else r=await sb.auth.signInWithPassword({email:e,password:pw});
 busy=false;if(r.error)return toast(r.error.message);
 if(!r.data.session)return toast("Check your email to confirm, then log in");
 await load()}
async function rpc(fn,args,ok){const{error}=await sb.rpc(fn,args);if(error)return toast(error.message.replace(/^.*?:/,""));toast(ok);await load()}
function openTg(){tgOpened=true;window.open(TG,"_blank");draw()}
function startRead(){if(done.read||timer)return;readLeft=20;page="read";draw();timer=setInterval(()=>{readLeft--;if(readLeft<=0){clearInterval(timer);timer=null}draw()},1000)}
async function claimRead(){await rpc("complete_task",{t:"read"},"+"+N(BONUS)+" earned!");page="tasks";draw()}
function withdraw(){const a=+$("wa").value;rpc("request_withdrawal",{a,b:$("wb").value.trim(),n:$("wn").value.trim(),nm:$("wm").value.trim()},"Withdrawal requested")}
function link(){return location.origin+location.pathname+"?ref="+P.code}
function copy(){navigator.clipboard&&navigator.clipboard.writeText(link()).then(()=>toast("Link copied"),()=>toast("Copy it manually"))}
function go(p){page=p;draw()}
const I=p=>'<svg viewBox="0 0 24 24">'+p+'</svg>';
const T=[["home",I('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/>'),"Home"],["tasks",I('<path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6h9M11 12h9M11 18h9"/>'),"Tasks"],["wallet",I('<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1" fill="currentColor"/>'),"Wallet"],["profile",I('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>'),"Profile"]];
const logo=`<div class="logo"><div class="lg">${esc(BRAND[0])}</div><span>${esc(BRAND)}</span></div>`;
const taskCard=(k,i,title,sub,btn)=>`<div class="card ${done[k]?'done':''}"><div class="row"><b>${i}. ${title}</b><span class="rw">+${N(BONUS)}</span></div><p class="mu">${sub}</p>${done[k]?'<p class="mu">Completed ✓</p>':btn}</div>`;
function view(){
 if(!U)return `<div class="top">${logo}</div><div class="hero"><h2 style="margin:0 0 6px">${mode==="reg"?"Create account":"Welcome back"}</h2><small>Complete tasks and invite friends to earn. Withdraw from ${N(MIN)}.</small></div>
 <div class="card" style="margin-top:14px">${mode==="reg"&&ref?'<p class="mu">You were invited by a friend 🎉</p>':''}${mode==="reg"?'<label>Full name</label><input id="nm">':''}<label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password">
 <button class="btn w" onclick="auth()">${mode==="reg"?"Register":"Log in"}</button><p class="mu" style="text-align:center;cursor:pointer" onclick="mode='${mode==="reg"?"login":"reg"}';draw()">${mode==="reg"?"Have an account? Log in":"New here? Create account"}</p></div>`;
 if(!P)return `<p class="mu">Loading…</p>`;
 let b=`<div class="top">${logo}<div class="pill">${N(P.balance)}</div></div>`;
 const tgC=taskCard("tg",1,"Telegram Task","Join our Telegram channel, then come back and tap “I Completed the Task”.",`<button class="btn" onclick="openTg()">Join Telegram Channel</button> <button class="btn" style="background:#fbd0e4;color:#a0155c" ${tgOpened?'':'disabled'} onclick="rpc('complete_task',{t:'tg'},'+${N(BONUS)} earned!')">I Completed the Task</button>`);
 const rdC=taskCard("read",2,"Read about our platform","Read about "+esc(BRAND)+", come back and earn instantly.",`<button class="btn" onclick="startRead()">Start Reading</button>`);
 if(page==="home")b+=`<div class="hero"><small>Wallet balance</small><div class="big">${N(P.balance)}</div><div class="bar"><i style="width:${Math.min(100,P.balance/MIN*100)}%"></i></div><small>${N(P.balance)} of ${N(MIN)} minimum withdrawal</small><div class="row" style="margin-top:14px"><small>Total earned ${N(P.earned)}</small><button class="btn g" onclick="go('wallet')">↓ Withdraw</button></div></div>
 <div class="stats"><div class="stat"><b>${N(P.earned)}</b><span>Earned</span></div><div class="stat"><b>${Object.keys(done).length}/2</b><span>Tasks done</span></div><div class="stat"><b>${refs}</b><span>Referrals</span></div></div>
 <div class="card row"><div><b>Invite friends</b><div class="mu">Earn ${N(BONUS)} per referral</div></div><button class="btn" onclick="go('refer')">Invite</button></div><h2>Available tasks</h2>${tgC}${rdC}`;
 if(page==="tasks")b+=`<h2>Tasks</h2>${tgC}${rdC}`;
 if(page==="read")b+=`<h2>About ${esc(BRAND)}</h2><div class="card"><p class="mu">${esc(BRAND)} is a rewards platform where you earn by completing simple tasks, joining our community and inviting friends.</p><p class="mu">Each task is credited to your wallet instantly, and you earn ${N(BONUS)} for every friend who registers with your link. Withdraw once you reach ${N(MIN)}.</p>${readLeft>0?`<button class="btn" disabled>Keep reading… ${readLeft}s</button>`:`<button class="btn" onclick="claimRead()">Claim ${N(BONUS)}</button>`}</div>`;
 if(page==="refer")b+=`<h2>Refer & Earn</h2><div class="hero"><small>Earn per invited friend</small><div class="big">${N(BONUS)}</div><small>Paid immediately when someone registers through your link.</small></div><div class="card" style="margin-top:14px"><label>Your referral link</label><div class="link">${esc(link())}</div><button class="btn" onclick="copy()">Copy link</button></div><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${refs}</b><span>Friends invited</span></div><div class="stat"><b>${N(refs*BONUS)}</b><span>Referral earnings</span></div></div>`;
 if(page==="wallet")b+=`<h2>Withdraw</h2><div class="hero"><small>Available balance</small><div class="big">${N(P.balance)}</div><small>Minimum withdrawal ${N(MIN)}</small></div><div class="card" style="margin-top:14px">${P.balance<MIN?`<p class="mu">You need ${N(MIN-P.balance)} more to withdraw.</p>`:''}<label>Amount</label><input id="wa" type="number" placeholder="${MIN}"><label>Bank name</label><input id="wb"><label>Account number</label><input id="wn" inputmode="numeric"><label>Account name</label><input id="wm"><button class="btn w" ${P.balance<MIN?'disabled':''} onclick="withdraw()">Withdraw</button></div>
 <div class="card hist"><b>Withdrawals</b>${wd.map(w=>`<div><span>${esc(w.bank)} · ${esc(w.acct_no)}</span><span>${N(w.amount)} · ${esc(w.status)}</span></div>`).join("")||'<p class="mu">None yet.</p>'}</div>`;
 if(page==="profile")b+=`<h2>Profile</h2><div class="card"><b>${esc(P.name)}</b><p class="mu">${esc(P.email)}<br>Referral code: ${esc(P.code)}</p><button class="btn" onclick="sb.auth.signOut().then(load)">Log out</button></div><div class="card hist"><b>Earnings history</b>${hist.map(h=>`<div><span>${esc(h.reason)}<br><small class="mu">${new Date(h.created_at).toLocaleString()}</small></span><b style="color:var(--ac)">+${N(h.amount)}</b></div>`).join("")||'<p class="mu">Nothing yet.</p>'}</div>`;
 return b+`<nav>${T.map(t=>`<button class="${page===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}${t[2]}</button>`).join("")}</nav>`}
function draw(){$("app").innerHTML=view()}
if(ref)mode="reg";
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT")load()});
load();
</script></body></html>
